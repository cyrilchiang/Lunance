<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集保大戶籌碼查詢</title>
<style>
  :root{--bg:#0f1420;--card:#1b2233;--ink:#e8edf6;--mut:#90a0bb;--line:#2c3650;--red:#ff5d5d;--blue:#5b9bff;--gray:#7c8aa5;--orange:#ffae42;}
  *{box-sizing:border-box;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink);padding:24px;max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  input,select,button{font-size:15px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  input{width:260px}
  button{background:var(--blue);border:none;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  #sug{position:relative}
  #sugbox{position:absolute;top:42px;left:0;width:300px;max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:9;display:none}
  #sugbox div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  #sugbox div:hover{background:#26314a}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .kpis{display:flex;gap:24px;flex-wrap:wrap;margin:6px 0 14px}
  .kpi b{font-size:24px}.kpi span{color:var(--mut);font-size:12px;display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mut);font-weight:500}
  .muted{color:var(--mut)}
  svg{width:100%;height:300px}
</style>
</head>
<body>
  <h1>集保大戶籌碼查詢</h1>
  <div class="sub" id="meta">載入資料中…</div>
  <div class="bar">
    <span id="sug">
      <input id="q" placeholder="輸入代號或名稱，例：2330 或 台積電" autocomplete="off" disabled>
      <div id="sugbox"></div>
    </span>
    <button onclick="go()">查詢</button>
  </div>
  <div id="result"></div>

<script>
let DATA=null, byName={};
const meta=document.getElementById('meta'), q=document.getElementById('q'), sugbox=document.getElementById('sugbox');

fetch('data.json?cb=' + Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  for(const c in DATA.stocks){const n=DATA.stocks[c].n; if(n)byName[n]=c;}
  meta.textContent=`資料日期：${DATA.dates[DATA.dates.length-1]}（共 ${DATA.dates.length} 週）　|　${Object.keys(DATA.stocks).length} 檔　|　資料來源：TDCC 集保戶股權分散表`;
  q.disabled=false; q.focus();
}).catch(e=>{ meta.textContent='讀取 data.json 失敗：'+e.message; });

q.addEventListener('input',()=>{
  const t=q.value.trim(); if(!t||!DATA){sugbox.style.display='none';return;}
  const hits=[];
  for(const c in DATA.stocks){const n=DATA.stocks[c].n;
    if(c.indexOf(t)===0||(n&&n.indexOf(t)>=0)){hits.push([c,n]); if(hits.length>=20)break;}}
  if(!hits.length){sugbox.style.display='none';return;}
  sugbox.innerHTML=hits.map(([c,n])=>`<div onclick="pick('${c}')"><b>${c}</b> <span class="muted">${n||''}</span></div>`).join('');
  sugbox.style.display='block';
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){sugbox.style.display='none';go();}});
function pick(c){q.value=c;sugbox.style.display='none';go();}

function resolve(t){
  t=t.trim(); if(!t||!DATA)return null;
  if(DATA.stocks[t])return t;
  if(byName[t])return byName[t];
  const cs=[];
  for(const c in DATA.stocks){const n=DATA.stocks[c].n; if(c.indexOf(t)===0||(n&&n.indexOf(t)>=0))cs.push(c);}
  return cs.length?cs[0]:null;
}

const COLORS=['#5b9bff','#5b9bff','#5b9bff','#7c8aa5','#7c8aa5','#7c8aa5','#ffae42','#ff5d5d'];
function lastIdx(st){for(let i=st.v.length-1;i>=0;i--){if(st.v[i] && st.v[i][7]!=null)return i;}return -1;}

function barSVG(ratio){
  const W=820,H=300,pad=46,maxv=Math.max(...ratio.filter(x=>x!=null),1),bw=(W-pad*2)/8;
  let s=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2c3650"/>`;
  ratio.forEach((r,i)=>{const h=(r||0)/maxv*(H-pad*2),x=pad+i*bw+6,y=H-pad-h;
    s+=`<rect x="${x}" y="${y}" width="${bw-12}" height="${h}" rx="3" fill="${COLORS[i]}"/>`;
    s+=`<text x="${x+(bw-12)/2}" y="${y-6}" fill="#e8edf6" font-size="12" text-anchor="middle">${r!=null?r.toFixed(1):''}</text>`;
    s+=`<text x="${x+(bw-12)/2}" y="${H-pad+18}" fill="#90a0bb" font-size="11" text-anchor="middle">${DATA.levels[i]}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function trendSVG(st){
  const W=820,H=280,pad=46,n=DATA.dates.length;
  const big=[],ret=[];
  for(let i=0;i<n;i++){const v=st.v[i]; big.push(v&&v[7]!=null?v[7]:null); ret.push(v&&v[0]!=null?v[0]:null);}
  const all=big.concat(ret).filter(x=>x!=null); if(!all.length)return '';
  const mx=Math.max(...all),mn=Math.min(...all),rng=(mx-mn)||1;
  const X=i=>pad+(n<=1?0:i*(W-pad*2)/(n-1)), Y=v=>H-pad-(v-mn)/rng*(H-pad*2);
  function path(arr,color){let p='',started=false;
    arr.forEach((v,i)=>{if(v==null)return; p+=(started?'L':'M')+X(i)+' '+Y(v)+' '; started=true;});
    let dots=arr.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${color}"/>`).join('');
    return `<path d="${p}" fill="none" stroke="${color}" stroke-width="2"/>${dots}`;}
  let xlabels=DATA.dates.map((d,i)=> (i%Math.ceil(n/8||1)===0)?`<text x="${X(i)}" y="${H-pad+18}" fill="#90a0bb" font-size="10" text-anchor="middle">${d.slice(5)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2c3650"/>${path(big,'#ff5d5d')}${path(ret,'#5b9bff')}${xlabels}
    <text x="${W-pad}" y="20" fill="#ff5d5d" font-size="12" text-anchor="end">超過1千張大戶</text>
    <text x="${W-pad}" y="36" fill="#5b9bff" font-size="12" text-anchor="end">10張以下散戶</text></svg>`;
}

function go(){
  const code=resolve(q.value), box=document.getElementById('result');
  if(!code){box.innerHTML='<div class="card muted">查無相符的代號或名稱</div>';return;}
  const st=DATA.stocks[code],di=lastIdx(st);
  if(di<0){box.innerHTML='<div class="card muted">'+code+' 無集保資料</div>';return;}
  const v=st.v[di],ratio=v.slice(0,8),lots=v.slice(8,16),ppl=v.slice(16,24);
  const big=ratio[7],big800=(ratio[6]||0)+(ratio[7]||0),retail=ratio[0];
  let rows='';
  for(let i=0;i<8;i++)rows+=`<tr><td>${DATA.levels[i]}</td><td>${ratio[i]!=null?ratio[i].toFixed(2):'-'}</td><td>${lots[i]!=null?Math.round(lots[i]).toLocaleString():'-'}</td><td>${ppl[i]!=null?Math.round(ppl[i]).toLocaleString():'-'}</td></tr>`;
  const trend = DATA.dates.length>=2 ? `<div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px">大戶 vs 散戶 持股比例走勢</div>${trendSVG(st)}</div>` : '';
  box.innerHTML=`
    <div class="card">
      <h2 style="margin:0 0 2px">${code} <span class="muted" style="font-size:16px">${st.n||''}</span></h2>
      <div class="muted" style="font-size:12px">資料日期 ${DATA.dates[di]}</div>
      <div class="kpis">
        <div class="kpi"><span>超過1千張大戶</span><b style="color:var(--red)">${big!=null?big.toFixed(2):'-'}%</b></div>
        <div class="kpi"><span>≥800張大戶</span><b style="color:var(--orange)">${big800.toFixed(2)}%</b></div>
        <div class="kpi"><span>10張以下散戶</span><b style="color:var(--blue)">${retail!=null?retail.toFixed(2):'-'}%</b></div>
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:4px">各持股分級比例（藍=散戶　灰=中實戶　橘/紅=大戶）</div>
      ${barSVG(ratio)}
    </div>
    ${trend}
    <div class="card"><table><thead><tr><th>持股分級</th><th>持股比例(%)</th><th>持有張數</th><th>持有人數</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
</script>
</body>
</html>
